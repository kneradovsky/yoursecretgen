version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uuidhash-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount Certbot certificates into the container.
      # Update the host path to match where your certificates actually live.
      - ./letsencrypt:/etc/letsencrypt:ro
      # Optional: webroot for Certbot HTTP-01 challenge validation.
      - ./certbot-www:/var/www/certbot:ro
    restart: unless-stopped

  # Optional Certbot service for certificate issuance and renewal.
  # Run once to obtain certificates:
  #   docker compose run --rm certbot certonly --webroot --webroot-path=/var/www/certbot \
  #     --email your-email@example.com --agree-tos --no-eff-email -d example.com
  # Run periodically to renew:
  #   docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot
    container_name: uuidhash-certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: ["certbot"]
    command: ["--version"]
